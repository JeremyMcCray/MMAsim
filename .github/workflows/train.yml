name: Train fighter brains

# Evolves the neural fighter brains by self-play (tools/train.js) and commits the checkpoints in brains/
# back to the repo, so the game (GitHub Pages) can offer them in the lobby. Run it from the Actions tab:
# "Train fighter brains" -> "Run workflow". Each run resumes from brains/population.json, so running it
# again keeps evolving the same lineage.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Training time budget in minutes (job limit is 360)'
        required: false
        default: '300'
      population:
        description: 'Population size'
        required: false
        default: '32'
      fresh:
        description: 'Start a fresh population instead of resuming'
        type: boolean
        required: false
        default: false

concurrency:
  group: train-brains
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Evolve
        run: |
          node tools/train.js \
            --minutes "${{ github.event.inputs.minutes || '300' }}" \
            --pop "${{ github.event.inputs.population || '32' }}" \
            --checkpoints 10 \
            ${{ inputs.fresh && '--fresh' || '' }}

      - name: Training summary
        if: always()
        run: |
          echo '## Brains' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| Checkpoint | Generation | Fitness | Win rate vs CPU | Rookie | Contender | Champion |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|---|---|---|---|---|' >> "$GITHUB_STEP_SUMMARY"
          node -e '
            const i = require("./brains/index.json");
            for (const b of i.brains) {
              const L = b.bench.byLevel, f = (l) => L[l] ? `${L[l].w}-${L[l].l}-${L[l].d}` : "";
              console.log(`| ${b.name} | ${b.gen} | ${b.fitness} | ${(b.winRate * 100).toFixed(0)}% | ${f("0.3")} | ${f("0.6")} | ${f("0.9")} |`);
            }' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit brains
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brains
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          LAST=$(node -e 'const i=require("./brains/index.json");const b=i.brains[i.brains.length-1];console.log(b?b.name+" ("+Math.round(b.winRate*100)+"% vs CPU)":"")')
          git commit -m "Train fighter brains: ${LAST} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
